---
layout: default
---

<!-- about.html -->
<div class="post">
  <article>
    {{ content }}

    <!-- News -->
    {% if page.news and site.announcements.enabled -%}
      <h2><a href="{{ '/news/' | relative_url }}" style="color: inherit;">News</a></h2>
      {%- include news.html limit=true %}
    {%- endif %}

    <!-- Social -->
    {%- if page.social %}
      <div class="social mt-5">
        <div class="contact-icons">
          {% include social.html %}
        </div>
        <div class="contact-note">
          {{ site.contact_note }}
        </div>
      </div>
    {%- endif %}
  </article>
</div>
